name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the installer to this existing release tag, e.g. v1.0.0. Leave blank to just build.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Work out the version
        id: ver
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v',''
          } elseif ($env:INPUT_RELEASE_TAG) {
            $v = $env:INPUT_RELEASE_TAG -replace '^v',''
          } else {
            $v = '1.0.0'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Check the version in the app matches the tag
        shell: pwsh
        run: |
          $src = Get-Content app/version.py -Raw
          if ($src -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') { throw 'APP_VERSION not found in app/version.py' }
          $appVer = $Matches[1]
          $want = '${{ steps.ver.outputs.version }}'
          Write-Host "app/version.py says $appVer, building $want"
          if ($appVer -ne $want) {
            throw "Version mismatch: app/version.py is $appVer but this build is $want. Update APP_VERSION before tagging."
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          foreach ($name in @('ffmpeg.exe','ffprobe.exe')) {
            $found = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter $name | Select-Object -First 1
            if (-not $found) { throw "$name not found in the download" }
            Copy-Item $found.FullName "ffmpeg\$name"
          }
          Write-Host ("ffmpeg is {0:N1} MB" -f ((Get-Item ffmpeg\ffmpeg.exe).Length / 1MB))

      - name: Make the icon
        run: python packaging/make_icon.py

      - name: Build the app
        run: pyinstaller packaging/shortgeek.spec --noconfirm --clean

      - name: Check the build actually holds together
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\ShortGeek\ShortGeek.exe')) { throw 'ShortGeek.exe was not produced' }
          foreach ($p in @(
            'dist\ShortGeek\_internal\ffmpeg\ffmpeg.exe',
            'dist\ShortGeek\_internal\ffmpeg\ffprobe.exe',
            'dist\ShortGeek\_internal\app\templates\index.html',
            'dist\ShortGeek\_internal\app\static\app.js',
            'dist\ShortGeek\_internal\app\static\app.css'
          )) {
            if (-not (Test-Path $p)) { throw "missing from the bundle: $p" }
          }

          # The stock clips must never end up inside the installer.
          if (Test-Path 'dist\ShortGeek\_internal\assets\backgrounds\custom') {
            $n = (Get-ChildItem 'dist\ShortGeek\_internal\assets\backgrounds\custom' -Recurse -File).Count
            if ($n -gt 0) { throw "$n third-party background clips were bundled; they must not be redistributed" }
          }

          $html = Get-Content 'dist\ShortGeek\_internal\app\templates\index.html' -Raw
          if ($html -notmatch 'btnUpdate')  { throw 'the bundled UI has no update check' }
          if ($html -notmatch 'brandVeil')  { throw 'the bundled UI has no first-run brand setup' }
          if ($html -match 'TGH Shorts Studio') { throw 'the bundled UI still says Shorts Studio' }

          $size = (Get-ChildItem dist\ShortGeek -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Bundle is {0:N1} MB" -f $size)

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\shortgeek.iss
          $inst = Get-Item packaging\Output\ShortGeekSetup.exe
          Write-Host ("Installer is {0:N1} MB" -f ($inst.Length / 1MB))

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ShortGeek-Windows-${{ steps.ver.outputs.version }}
          path: packaging/Output/ShortGeekSetup.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: packaging/Output/ShortGeekSetup.exe
